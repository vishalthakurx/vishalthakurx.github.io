<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Vishal Thakur</title>
    <meta name="description" content="Contact Vishal Thakur for services, collaborations, and inquiries.">
    <meta property="og:title" content="Contact - Vishal Thakur">
    <meta property="og:description" content="Reach out to Vishal for projects and collaborations.">
    <meta property="og:url" content="https://vishalthakurx.github.io/contact.html">
    <link rel="canonical" href="https://vishalthakurx.github.io/contact.html">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="/includes/include-loader.js"></script>
    <script src="/common.js" defer></script>
    <script src="analyticsTracker.js"></script>
</head>
<body>
    <div data-include="/includes/header.html"></div>
    <main class="container">
        <section id="contact">
            <h2>Contact Me</h2>
            <p>Feel free to reach out to me for collaboration or inquiries. You can connect with me on LinkedIn or send me a message using the form below.</p>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    <div data-include="/includes/footer.html"></div>
</body>
</html>
